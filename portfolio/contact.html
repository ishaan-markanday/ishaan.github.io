<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- CRUCIAL for responsive scaling -->
    <title>Contact Ishaan Markanday</title>
    <link rel="stylesheet" href="animations_css.css">
    <link rel="stylesheet" href="style.css"> <!-- Link to the NEW style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">{{name}}</a>
            <nav class="nav">
                <a href="index.html">About</a>
                <a href="experience.html">Experience</a>
                <a href="certifications.html">Certifications</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="section animate-fade-in">
            <div class="container">
                <div class="contact-form">
                    <h2>Get in Touch</h2>
                    <p style="text-align:center;">
                        If you prefer, you can also reach me directly at:
                        <br>
                        <strong>Email:</strong> <a href="mailto:{{email}}">{{email}}</a> <br>
                        <strong>Phone:</strong> <a href="tel:{{phone}}">{{phone}}</a>
                    </p>
                    <form action="http://localhost:8000/submit_form" method="POST">
                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message:</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
