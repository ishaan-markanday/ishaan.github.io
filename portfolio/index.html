<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishaan Markanday | Portfolio</title>
    <link rel="stylesheet" href="animations_css.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">{{name}}</a>
            <nav class="nav">
                <a href="index.html">About</a>
                <a href="experience.html">Experience</a>
                <a href="certifications.html">Certifications</a>
                <a href="projects.html">Projects</a>
                <a href="achievements.html">Achievements</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero animate-fade-in">
            <div class="hero-background-elements"></div> 
            <div class="hero-content">
                <img src="{{photo_url}}" alt="Your Photo" class="hero-photo animate-scale-in">
                <h1 class="animate-fade-in-up"><span class="highlight">{{name}}</span></h1>
                <p class="hero-summary animate-fade-in-up" style="animation-delay: 0.2s;">
                    Cybersecurity Enthusiast | Innovating Secure Digital Futures
                </p>
                

            </div>
        </section>

        <section class="section about-section">
            <div class="container">
                <h2>About Me</h2>
                <p>{{about_intro}}</p>
                
                <div class="skills-container">
                    <h3>Technical Skills</h3>
                    <ul class="skills-list">
                        {{technical_skills}}
                    </ul>
                </div>

                <div class="skills-container">
                    <h3>Soft Skills</h3>
                    <ul class="skills-list">
                        {{soft_skills}}
                    </ul>
                </div>

                <div class="contact-details-section">
                    <h3>Direct Contact</h3>
                    <p>
                        <strong>Email:</strong> <a href="mailto:{{email}}">{{email}}</a> <br>
                        <strong>Phone:</strong> <a href="tel:{{phone}}">{{phone}}</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
