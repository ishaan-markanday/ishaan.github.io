<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Achievements</title>
    <link rel="stylesheet" href="animations_css.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">{{name}}</a>
            <nav class="nav">
                <a href="index.html">About</a>
                <a href="experience.html">Experience</a>
                <a href="certifications.html">Certifications</a>
                <a href="projects.html">Projects</a>
                <a href="achievements.html">Achievements</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="section animate-fade-in">
            <div class="container">
                <h2>Achievements</h2>
                
                <!-- TryHackMe Progress Badge -->
                <div class="featured-badge animate-fade-in-up" style="animation-delay: 0.1s;">
                    <h3>Cybersecurity Learning Journey</h3>
                    <div class="badge-wrapper">
                        <iframe 
                            src="https://tryhackme.com/api/v2/badges/public-profile?userPublicId=4046686" 
                            style="border: none; width: 100%; max-width: 700px; height: 400px; display: block; margin: 0 auto;">
                        </iframe>
                    </div>
                </div>

                <!-- Divider -->
                <hr style="margin: 50px 0; border: none; border-top: 1px solid rgba(255, 255, 255, 0.1);">

                <!-- Other Achievements -->
                <div class="achievements-list">
                    {{achievements_list}}
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
